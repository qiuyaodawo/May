name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        id: build
        run: pnpm build
      - name: Check bilingual documentation
        run: pnpm docs:check
      - name: Run offline tests
        run: pnpm test
      - name: Run full suite with temporary path aliases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:path-alias
      - name: Run deterministic example
        run: pnpm example
      - name: Check May CLI entry point
        run: pnpm may --help
      - name: Check MaybeCode CLI entry point
        run: pnpm maybecode --help

  package:
    name: MaybeCode package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify packed dependencies and installed CLI
        run: pnpm test:package:maybecode
