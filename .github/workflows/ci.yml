name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Check bilingual documentation
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: pnpm docs:check
      - name: Run offline tests
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.os != 'windows-latest' }}
        run: pnpm test
      - name: Run full suite with temporary path aliases
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' }}
        run: pnpm test:path-alias
      - name: Run deterministic example
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: node examples/basic/basic.mjs
      - name: Check May CLI entry point
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: node apps/cli/dist/bin.js --help

  package:
    name: MaybeCode package smoke test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify packed dependencies and installed CLI
        run: pnpm test:package:maybecode
